<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — UPSC Tracker</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #050505; --bg2: #0c0c0c; --bg3: #1a1a1a; --bg4: #2a2a2a;
  --text: #f0e6d0; --text2: #c8b07a; --text3: #8a7550;
  --accent: #c8942a; --accent2: #d4a833; --accent-bg: rgba(200,148,42,0.12);
  --gold: #d4a017; --gold-light: #f5d778; --gold-dark: #8a6500;
  --red: #ef4444; --radius: 10px;
}
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
}
.login-card {
  background: var(--bg2); border: 1px solid #1f1a10; border-radius: 16px;
  padding: 40px 36px; width: 100%; max-width: 380px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 80px rgba(212,160,23,0.05);
}
.login-card h1 {
  font-size: 22px; text-align: center; margin-bottom: 6px;
}
.login-card .subtitle {
  text-align: center; font-size: 13px; color: var(--text3); margin-bottom: 28px;
}
.form-group { margin-bottom: 18px; }
.form-group label {
  display: block; font-size: 12px; font-weight: 600; color: var(--text2);
  margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
}
.form-group input {
  width: 100%; padding: 10px 14px; border-radius: var(--radius);
  border: 1px solid var(--bg4); background: var(--bg3); color: var(--text);
  font-size: 14px; outline: none; transition: border 0.2s;
}
.form-group input:focus { border-color: var(--gold); }
.error-msg {
  background: rgba(239,68,68,0.12); color: var(--red); font-size: 13px;
  padding: 10px 14px; border-radius: var(--radius); margin-bottom: 18px;
  text-align: center;
}
.login-btn {
  width: 100%; padding: 12px; border-radius: var(--radius); border: 1px solid rgba(212,160,23,0.3);
  background: linear-gradient(135deg, rgba(212,160,23,0.15), rgba(200,148,42,0.1)); color: #d4a017; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: background 0.2s, box-shadow 0.2s; letter-spacing: 0.3px;
}
.login-btn:hover { background: linear-gradient(135deg, rgba(212,160,23,0.25), rgba(200,148,42,0.18)); box-shadow: 0 2px 16px rgba(212,160,23,0.2); }
.footer { text-align: center; margin-top: 20px; font-size: 11px; color: var(--text3); }
.logo-area { text-align: center; margin-bottom: 24px; }
.emblem-wrapper {
  display: inline-flex; align-items: center; justify-content: center;
  width: 80px; height: 80px; border-radius: 50%;
  background: transparent; border: none;
  box-shadow: 0 4px 24px rgba(212,160,23,0.4), 0 0 40px rgba(212,160,23,0.15);
  margin-bottom: 14px;
  position: relative; overflow: hidden;
}
.emblem-wrapper::after {
  content: '';
  position: absolute; top: -100%; left: -100%;
  width: 60%; height: 200%;
  z-index: 2;
  background: linear-gradient(
    115deg,
    transparent 20%,
    rgba(255,255,255,0.45) 45%,
    rgba(255,255,255,0.7) 50%,
    rgba(255,255,255,0.45) 55%,
    transparent 80%
  );
  transform: rotate(25deg);
  animation: emblem-shine 3s ease-in-out infinite;
  pointer-events: none;
}
@keyframes emblem-shine {
  0%   { top: -100%; left: -100%; opacity: 0; }
  10%  { opacity: 1; }
  50%  { top: 100%; left: 100%; opacity: 1; }
  60%  { opacity: 0; }
  100% { top: 100%; left: 100%; opacity: 0; }
}
.emblem-wrapper svg { filter: drop-shadow(0 1px 1px rgba(0,0,0,0.3)); position: relative; z-index: 1; }
.emblem-wrapper img {
  width: 80px; height: 80px; object-fit: cover; border-radius: 50%;
  position: relative; z-index: 1;
}
.brand-name {
  font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: 1.5px;
}
.brand-name .kkcs {
  background: linear-gradient(135deg, #d4a017, #f5d778, #c8942a);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; font-weight: 800;
}
.brand-fullname {
  font-size: 9px; color: var(--text3); letter-spacing: 2.5px;
  text-transform: uppercase; margin-top: 2px;
}
</style>
</head>
<body>
  <div class="login-card">
    <div class="logo-area">
      <div class="emblem-wrapper">
        <img src="/static/images/ashoka-emblem.webp" alt="Ashoka Emblem">
      </div>
      <div class="brand-name"><span class="kkcs">KKCS</span></div>
      <div class="brand-fullname">Kandukuri Kishore Chandra Sekhar</div>
    </div>
    <p class="subtitle">Spaced Repetition System</p>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn">Sign In</button>
    </form>
    <p class="footer">Authenticated access only</p>
  </div>
</body>
</html>
